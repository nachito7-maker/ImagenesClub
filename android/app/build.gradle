plugins { id 'com.android.application' }

// Firma de release: credenciales fuera del control de versiones (ver .gitignore).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'es.imagenesclub.game'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'es.imagenesclub.game'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProps.getProperty('storeFile', 'keystore/release.jks'))
            storePassword keystoreProps.getProperty('storePassword')
            keyAlias keystoreProps.getProperty('keyAlias')
            keyPassword keystoreProps.getProperty('keyPassword')
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.9.0' }

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:assembleRelease') && !keystorePropsFile.exists()) {
        throw new GradleException("Falta ${keystorePropsFile}: crea el keystore de release y vuelve a ejecutar 'assembleRelease'.")
    }
}
